name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.changeset/**'
      - 'scripts/publish.ts'
      - 'scripts/verify-pack.ts'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check for unpublished packages
        id: plan
        run: |
          bunx changeset publish-plan --output publish-plan.json
          publish=$(bun -e "Bun.file('publish-plan.json').json().then(plan => console.log(plan.plan.length > 0))")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Publish with OIDC
        run: bun run release
      - name: Push release tags
        run: git push --tags
