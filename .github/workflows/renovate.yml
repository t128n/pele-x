name: Renovate

on:
  schedule:
    # Check npm for new Pele releases every hour.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'renovate.json'
      - 'scripts/changeset-pele.mjs'
      - '.github/workflows/renovate.yml'

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for Renovate token
        id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::warning title=Renovate token missing::Add a RENOVATE_TOKEN secret; see docs/dependency-updates.md. Skipping this run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Run Renovate
        if: steps.token.outputs.present == 'true'
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          # Let Renovate install Bun in its container so it can refresh bun.lock.
          RENOVATE_BINARY_SOURCE: install
          # Allow only the script that writes the Pele changeset.
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/changeset-pele\\.mjs [0-9]+\\.[0-9]+\\.[0-9]+[0-9A-Za-z.+-]*$"]'
